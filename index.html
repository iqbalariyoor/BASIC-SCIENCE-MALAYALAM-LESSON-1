<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>അളവുകളും യൂണിറ്റുകളും - STD 8 BS Unit 1 ML</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;600;700;800&family=Baloo+2:wght@600;800&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#0277BD;
  --secondary:#E65100;
  --accent:#FFB300;
  --success:#2E7D32;
  --danger:#C62828;
  --purple:#5E35B1;
  --bg-gradient:linear-gradient(180deg,#E1F5FE 0%,#FFFDE7 45%,#FFFFFF 85%);
  --shadow:0 8px 24px rgba(0,0,0,0.12);
  --radius:20px;
}
*{box-sizing:border-box;user-select:none;margin:0;padding:0}
body{
  background:var(--bg-gradient);
  min-height:100vh;
  color:#263238;
  font-family:'Noto Sans Malayalam','Noto Sans',Quicksand,sans-serif;
  line-height:1.6;
}
h1,h2,h3,.btn-menu,.section-title,.story-title,.main-title,.logo-area h1{
  font-family:'Noto Sans Malayalam','Baloo 2',sans-serif;
}
#app{
  max-width:1050px;
  margin:0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  padding:15px;
}
header{
  background:rgba(255,255,255,0.98);
  padding:12px 20px;
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
  flex-wrap:wrap;
  gap:10px;
  border:2px solid #E1F5FE;
}
.logo-area{display:flex;align-items:center;gap:12px;cursor:pointer}
.logo-area h1{font-size:1.2rem;color:var(--primary);font-weight:800;letter-spacing:-0.3px}
.logo-area span{font-size:.78rem;background:#E1F5FE;color:#0277BD;padding:4px 10px;border-radius:12px;font-weight:bold;border:1px solid #B3E5FC}
.stats-bar{
  display:flex;
  gap:14px;
  background:#FFF9C4;
  padding:8px 18px;
  border-radius:30px;
  border:2px solid #FBC02D;
  font-weight:bold;
  font-size:0.95rem;
}
.icon-btn{
  background:#fff;
  border:2px solid #CFD8DC;
  width:42px;
  height:42px;
  border-radius:50%;
  cursor:pointer;
  font-size:1.15rem;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  transition:transform 0.1s;
}
.icon-btn:active{transform:scale(0.92)}
.screen{display:none;flex-direction:column;align-items:center;width:100%;flex:1}
.screen.active{display:flex}
.home-card{
  background:#fff;
  border-radius:26px;
  padding:26px 18px;
  text-align:center;
  box-shadow:var(--shadow);
  width:100%;
  max-width:820px;
  margin:auto;
  border:3px solid #E0F2F1;
}
.main-title{color:#01579B;font-size:1.85rem;margin-top:6px}
.sub-title{color:#D84315;font-size:1.05rem;margin:6px 0 16px;font-weight:700}
.menu-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:12px;
  width:100%;
}
.btn-menu{
  padding:14px 12px;
  border:none;
  border-radius:18px;
  font-size:.96rem;
  font-weight:bold;
  color:#fff;
  cursor:pointer;
  box-shadow:0 6px 0 rgba(0,0,0,0.18);
  transition:transform 0.1s, box-shadow 0.1s;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  text-align:center;
}
.btn-menu:active{
  transform:translateY(3px);
  box-shadow:0 3px 0 rgba(0,0,0,0.18);
}
.b1{background:linear-gradient(135deg,#0277BD,#0288D1)}
.b2{background:linear-gradient(135deg,#E64A19,#F4511E)}
.b3{background:linear-gradient(135deg,#2E7D32,#43A047)}
.b4{background:linear-gradient(135deg,#6A1B9A,#8E24AA)}
.b5{background:linear-gradient(135deg,#D81B60,#E91E63)}
.b6{background:linear-gradient(135deg,#00838F,#00ACC1)}
.b7{background:linear-gradient(135deg,#F57F17,#FBC02D);color:#37474F}
.b8{background:linear-gradient(135deg,#37474F,#455A64)}
.b9{background:linear-gradient(135deg,#4E342E,#6D4C41)}
.b10{background:linear-gradient(135deg,#1565C0,#1976D2)}
.b11{background:linear-gradient(135deg,#558B2F,#689F38)}
.b12{background:linear-gradient(135deg,#00695C,#00897B)}
.b13{background:linear-gradient(135deg,#C2185B,#D81B60)}
.b14{background:linear-gradient(135deg,#283593,#3F51B5)}
.b15{background:linear-gradient(135deg,#BF360C,#E64A19)}

.section-header{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
  background:#fff;
  padding:12px 18px;
  border-radius:16px;
  box-shadow:var(--shadow);
  flex-wrap:wrap;
  gap:10px;
}
.section-title{font-size:1.15rem;color:var(--primary);font-weight:800}
.back-btn{
  background:#455A64;
  color:#fff;
  border:none;
  padding:8px 20px;
  border-radius:22px;
  cursor:pointer;
  font-weight:bold;
  font-size:0.9rem;

.back-btn:active{transform:scale(0.95)}
.content-box{

  border-radius:24px;
  padding:22px;
  box-shadow:var(--shadow);

  max-width:880px;

.activity-block{
  background:#F1F8E9;
  border:2px solid #DCEDC8;
  border-radius:16px;
  padding:16px;
  margin-bottom:14px;
  text-align:left;
}
.activity-heading{
  color:#2E7D32;
  font-size:1.1rem;
  font-weight:800;
  margin-bottom:8px;
}
.story-para{
  background:#E1F5FE;
  border-left:6px solid #0288D1;
  padding:14px 16px;
  border-radius:14px;
  margin-bottom:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;

}
.story-para p{font-size:1.02rem;line-height:1.75;flex:1;color:#1A237E}
.mini-play{
  background:#0288D1;

  height:42px;

  align-items:center;
  justify-content:center;
  flex-shrink:0;
}
.read-all-btn{
  background:linear-gradient(135deg,#0277BD,#01579B);
  color:#fff;
  border:none;
  padding:12px 26px;
  border-radius:25px;
  font-weight:bold;
  cursor:pointer;
  margin-bottom:14px;
  box-shadow:0 4px 10px rgba(2,119,189,0.3);
}
.word-eng{font-size:1.4rem;font-weight:800;color:#01579B;margin:6px 0}
.game-box{
  background:#fff;
  border-radius:24px;
  padding:24px;
  box-shadow:var(--shadow);
  width:100%;
  max-width:740px;
  margin:0 auto;
  text-align:center;
  border:3px solid #E1F5FE;
}
.options-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px;
  max-width:580px;
  margin:16px auto;
}
.option-btn{
  background:#fff;
  border:3px solid #81D4FA;
  padding:12px;
  border-radius:16px;
  font-weight:bold;
  color:#01579B;
  cursor:pointer;
  font-size:0.96rem;
  transition:all 0.15s;
}
.option-btn:hover{background:#E1F5FE}
.option-btn.selected{border-color:#0277BD;background:#B3E5FC}
.option-btn.correct{background:#C8E6C9 !important;border-color:#2E7D32 !important;color:#1B5E20 !important}
.option-btn.wrong{background:#FFCDD2 !important;border-color:#C62828 !important;color:#B71C1C !important}
.submit-quiz-btn{
  background:#2E7D32;
  color:#fff;
  border:none;
  padding:12px 30px;
  border-radius:24px;
  font-weight:bold;
  cursor:pointer;
  margin-top:12px;
  font-size:1rem;
}
.seq-item{
  background:#fff;
  border:2px solid #CFD8DC;
  border-radius:14px;
  padding:12px;
  margin-bottom:10px;
  cursor:pointer;
  text-align:left;
  transition:0.15s;
}
.seq-item.selected{border-color:#FFB300;background:#FFF9C4}
.seq-item.correct{border-color:#2E7D32;background:#E8F5E9}
.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.65);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
}
.modal-overlay.active{display:flex}
.reward-card{
  background:#fff;
  border-radius:24px;
  padding:26px;
  text-align:center;
  border:6px solid #FFD54F;
  max-width:380px;
  width:90%;
  animation:pop 0.3s ease;
}
@keyframes pop{0%{transform:scale(0.8)} 100%{transform:scale(1)}}
textarea.note{
  width:100%;
  min-height:95px;
  border:2px solid #B0BEC5;
  border-radius:14px;
  padding:12px;
  font-family:'Noto Sans Malayalam',sans-serif;
  margin-top:8px;
}
.qp-toolbar{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:10px 0 16px}
.qp-btn{
  border:none;
  color:#fff;
  padding:10px 24px;
  border-radius:24px;
  font-weight:bold;
  cursor:pointer;
  font-size:.95rem;
  box-shadow:0 4px 0 rgba(0,0,0,0.18);
}
.qp-print{background:linear-gradient(135deg,#0277BD,#0288D1)}
.qp-pdf{background:linear-gradient(135deg,#C62828,#EF5350)}
.qp-meta{text-align:center;margin-bottom:12px;color:#455A64;font-weight:700}
.qp-act{background:#fff;border:2px solid #E0E0E0;border-radius:14px;padding:12px 16px;margin:10px 0;text-align:left}
.qp-qno{font-weight:800;color:#0277BD;margin-right:6px}
.qp-mark{float:right;color:#E65100;font-weight:800}

table.science-tbl{
  width:100%;
  border-collapse:collapse;
  margin:10px 0;
  font-size:0.94rem;
}
table.science-tbl th, table.science-tbl td{
  border:1px solid #CFD8DC;
  padding:10px 12px;
  text-align:left;
}
table.science-tbl th{
  background:#E1F5FE;
  color:#01579B;
  font-weight:700;
}
table.science-tbl tr:nth-child(even){background:#F9FBE7}

@media print{
  header,.back-btn,.qp-toolbar,.icon-btn,.stats-bar{display:none !important}
  body{background:#fff !important}
  #app{padding:0;max-width:100%}
  .content-box{box-shadow:none;border-radius:0;max-width:100%;border:none}
  .screen{display:none !important}
  .screen.active{display:block !important}
  .qp-act{break-inside:avoid;border:1px solid #888}
}
</style>
</head>

<script>
const UNIT_NO = "8_1";

/* Full lesson text lines directly from Standard 8 Chapter 1 */
const READ_LINES = [
  "വസ്തുക്കളുടെയും പ്രതിഭാസങ്ങളുടെയും സ്വഭാവസവിശേഷതകൾ അളന്ന് പ്രസ്താവിക്കാൻ കഴിയുന്ന അളവുകളാണ് ഭൗതിക അളവുകൾ (Physical Quantities).",
  "പരസ്പരം ബന്ധമില്ലാതെ സ്വതന്ത്രമായി നിലനിൽക്കുന്നതും മറ്റ് അളവുകൾ ഉപയോഗിച്ച് പ്രസ്താവിക്കാൻ കഴിയാത്തതുമായ അളവുകളാണ് അടിസ്ഥാന അളവുകൾ (Fundamental Quantities).",
  "നീളം, മാസ്, സമയം, താപനില, വൈദ്യുതപ്രവാഹ തീവ്രത, പ്രകാശതീവ്രത, പദാർത്ഥത്തിന്റെ അളവ് എന്നിവയാണ് ഏഴ് അടിസ്ഥാന അളവുകൾ.",
  "അടിസ്ഥാന അളവുകൾ ഉപയോഗിച്ച് പ്രസ്താവിക്കാൻ കഴിയുന്ന അളവുകളെ വ്യുൽപന്ന അളവുകൾ (Derived Quantities) എന്ന് വിളിക്കുന്നു. ഉദാഹരണത്തിന് പരപ്പളവ്, വ്യാപ്തം, സാന്ദ്രത, വേഗത, ബലം എന്നിവ.",

<script>
/* Web Audio API Sound Synthesizer for rich click/success/wrong audio */
function playSound(type) {
  if (!state.audioEnabled) return;
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    
    if (type === 'correct') {
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, now); // C5
      osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.12); // G5
      osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.25); // C6
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.32);
    } else if (type === 'wrong') {
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(280, now);
      osc.frequency.exponentialRampToValueAtTime(130, now + 0.25);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.3);
    } else if (type === 'click') {
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(600, now);
      osc.frequency.exponentialRampToValueAtTime(400, now + 0.05);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.06);
    } else if (type === 'star') {
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const start = ctx.currentTime + idx * 0.08;
        osc.frequency.setValueAtTime(freq, start);
        gain.gain.setValueAtTime(0.1, start);
        gain.gain.exponentialRampToValueAtTime(0.001, start + 0.2);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(start);
        osc.stop(start + 0.22);
      });
    }
  } catch (e) {
    console.debug('Audio error:', e);
  }
}

/* TTS Speaking Feature */
let ttsUnlocked = false;
function unlockTtsAudio() {
  if (ttsUnlocked) return;
  ttsUnlocked = true;
  if ('speechSynthesis' in window) {
    try { window.speechSynthesis.getVoices(); } catch (e) {}
  }
}
document.addEventListener('click', unlockTtsAudio, { passive: true });
document.addEventListener('touchstart', unlockTtsAudio, { passive: true });

function stopSpeak() {
  if ('speechSynthesis' in window) {
    try { window.speechSynthesis.cancel(); } catch (e) {}
  }
}

function speakText(text, onend) {
  if (!state.audioEnabled) { if (onend) onend(); return; }
  unlockTtsAudio();
  text = String(text || '').trim();
  if (!text) { if (onend) onend(); return; }
  stopSpeak();

  if ('speechSynthesis' in window) {
    try {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ml-IN';
      u.rate = 0.90;
      const voices = window.speechSynthesis.getVoices() || [];
      const malVoice = voices.find(v => /ml|Malayalam/i.test((v.lang || '') + (v.name || ''))) ||
                       voices.find(v => /hi-IN|ta-IN|en-IN/i.test(v.lang || ''));
      if (malVoice) u.voice = malVoice;
      u.onend = function() { if (onend) onend(); };
      u.onerror = function() { if (onend) onend(); };
      window.speechSynthesis.speak(u);
    } catch (e) {
      if (onend) onend();
    }
  } else {
    if (onend) onend();
  }
}

            <tr><td><b>പദാർത്ഥത്തിന്റെ അളവ്</b></td><td>mol (മോൾ)</td><td>കണികകളുടെ എണ്ണത്തെ അടിസ്ഥാനമാക്കിയുള്ള അളവ്.</td></tr>
            <tr><td><b>പരപ്പളവ് (Area)</b></td><td>m²</td><td>നീളം × വീതി (വ്യുൽപന്ന അളവ്)</td></tr>
            <tr><td><b>വ്യാപ്തം (Volume)</b></td><td>m³ (ലിറ്റർ)</td><td>വസ്തു ഉൾക്കൊള്ളുന്ന സ്ഥലം.</td></tr>
            <tr><td><b>സാന്ദ്രത (Density)</b></td><td>kg/m³</td><td>യൂണിറ്റ് വ്യാപ്തത്തിലെ മാസ് = മാസ് / വ്യാപ്തം.</td></tr>
            <tr><td><b>ലീസ്റ്റ് കൗണ്ട് (Least Count)</b></td><td>0.1 cm</td><td>ഉപകരണത്തിന് അളക്കാവുന്ന ഏറ്റവും ചെറിയ അളവ്.</td></tr>
            <tr><td><b>പ്രകാശവർഷം (Light Year)</b></td><td>ly (~9.46×10¹² km)</td><td>പ്രകാശം 1 വർഷം കൊണ്ട് സഞ്ചരിക്കുന്ന ദൂരം.</td></tr>
            <tr><td><b>ആസ്ട്രോണമിക്കൽ യൂണിറ്റ് (AU)</b></td><td>1.5 × 10⁸ km</td><td>ഭൂമിയിൽ നിന്നും സൂര്യനിലേക്കുള്ള ശരാശരി ദൂരം.</td></tr>
          </table>`;
  setContent('📚 പദസഞ്ചയം (Glossary)', h);
}

/* 8 GAMES IMPLEMENTATION */
function launchGame(n) {
  playClickSound();
  state.gi = 0;
  state.queue = [...VOCAB].sort(() => Math.random() - 0.5);
  state.active = n;
  showScreen('gameScreen');
  renderGame();
}

function renderGame() {
  const n = state.active;
  document.getElementById('gameTitle').innerText = GAME_TITLES[n] || 'കളി';
  const box = document.getElementById('gameBox');

  if (n === 7) return renderSeq();
  if (n === 8) return renderTF();

  const item = state.queue[state.gi % state.queue.length];

  if (n === 1) {
    // 1. Icon / Concept Match
    let opts = [item.word];
    while (opts.length < 4) {
      const r = VOCAB[Math.floor(Math.random() * VOCAB.length)].word;
      if (!opts.includes(r)) opts.push(r);
    }
    opts.sort(() => Math.random() - 0.5);
    box.innerHTML = `
      <div style="font-size:3.6rem;margin-bottom:8px">${item.emoji}</div>
      <p style="font-size:1.1rem;color:#01579B;font-weight:700">ഈ ചിഹ്നം സൂചിപ്പിക്കുന്ന ശാസ്ത്രപദം / ഭൗതിക അളവ് ഏതാണ്?</p>
      <div class="options-grid">
        ${opts.map(o => `<button class="option-btn" onclick="checkAnswer(this, '${o}', '${item.word}')">${o}</button>`).join('')}
      </div>
    `;
  } else if (n === 2) {
    // 2. Definition Match
    let opts = [item.meaning];
    while (opts.length < 4) {
      const r = VOCAB[Math.floor(Math.random() * VOCAB.length)].meaning;
      if (!opts.includes(r)) opts.push(r);
    }
    opts.sort(() => Math.random() - 0.5);
    box.innerHTML = `
      <p style="color:#01579B;font-weight:bold">ശരിയായ നിർവചനം / വിവരണം തിരഞ്ഞെടുക്കുക:</p>
      <div class="word-eng">${item.emoji} ${item.word}</div>
      <div class="options-grid">
        ${opts.map(m => `<button class="option-btn" onclick="checkAnswer(this, '${m}', '${item.meaning}')">${m}</button>`).join('')}
      </div>
    `;
  } else if (n === 3) {
    // 3. Fill in Missing Letter
    const d = item.distractors || ['അ', 'ഇ', 'ഉ', 'എ'];
    const opts = [item.missingLetter, ...d].filter((v, i, a) => a.indexOf(v) === i).slice(0, 4).sort(() => Math.random() - 0.5);
    box.innerHTML = `
      <div style="font-size:2.8rem">${item.emoji}</div>
      <p style="font-size:1.05rem;color:#455A64">വിട്ടുപോയ അക്ഷരം നികത്തുക:</p>
      <div style="font-size:1.8rem;font-weight:800;color:#01579B;margin:12px 0">${item.missingDisplay}</div>
      <div class="options-grid">
        ${opts.map(o => `<button class="option-btn" onclick="checkAnswer(this, '${o}', '${item.missingLetter}')">${o}</button>`).join('')}
      </div>
    `;
  } else if (n === 4) {
    // 4. Word Scramble
    const scrambled = item.letters.slice().sort(() => Math.random() - 0.5).join('   ');
    box.innerHTML = `
      <div style="font-size:2.8rem">${item.emoji}</div>
      <p style="font-size:1.05rem;color:#455A64;margin-bottom:6px">താഴെ ക്രമം തെറ്റി കിടക്കുന്ന അക്ഷരങ്ങൾ കൂട്ടിച്ചേർത്ത് വാക്ക് കണ്ടെത്തുക:</p>
      <div style="background:#E1F5FE;padding:14px;border-radius:16px;font-size:1.4rem;font-weight:800;color:#0277BD;margin:12px auto;max-width:400px;letter-spacing:2px">${scrambled}</div>
      <p style="color:#555;font-size:0.95rem">സൂചന: ${item.meaning}</p>
      <button class="read-all-btn" style="margin-top:14px" onclick="checkAnswer(this, '${item.word}', '${item.word}')">ഉത്തരം കാണുക: <b>${item.word}</b></button>
    `;
  } else if (n === 5) {
    // 5. TTS Audio Listening Game
    speakText(item.word);
    let opts = [item];
    while (opts.length < 4) {
      const r = VOCAB[Math.floor(Math.random() * VOCAB.length)];
      if (!opts.some(x => x.word === r.word)) opts.push(r);
    }
    opts.sort(() => Math.random() - 0.5);
    box.innerHTML = `
      <div style="margin-bottom:12px">
        <button class="read-all-btn" onclick="playClickSound();speakText('${item.word}')">🔊 ശബ്ദം വീണ്ടും കേൾക്കുക</button>
      </div>
      <p style="color:#01579B;font-weight:bold">നിങ്ങൾ കേട്ട വാക്ക് താഴെ നിന്ന് തിരഞ്ഞെടുക്കുക:</p>
      <div class="options-grid">
        ${opts.map(v => `<button class="option-btn" onclick="checkAnswer(this, '${v.word}', '${item.word}')">${v.emoji} ${v.word}</button>`).join('')}
      </div>
    `;
  } else if (n === 6) {
    // 6. Science Meaning & SI Unit Quiz
    let opts = [item.word];
    while (opts.length < 4) {
      const r = VOCAB[Math.floor(Math.random() * VOCAB.length)].word;
      if (!opts.includes(r)) opts.push(r);
    }
    opts.sort(() => Math.random() - 0.5);
    box.innerHTML = `
      <div style="background:#FFF9C4;padding:14px;border-radius:14px;border:2px solid #FBC02D;font-weight:700;margin-bottom:14px;color:#37474F">
        "${item.meaning}"
      </div>
      <p style="color:#01579B;font-weight:bold">മുകളിൽ തന്നിരിക്കുന്ന പ്രസ്താവന ഏത് ഭൗതിക അളവുമായി ബന്ധപ്പെട്ടിരിക്കുന്നു?</p>
      <div class="options-grid">
        ${opts.map(w => `<button class="option-btn" onclick="checkAnswer(this, '${w}', '${item.word}')">${w}</button>`).join('')}
      </div>
    `;
  }
}

function checkAnswer(el, got, need) {
  if (got === need) {
    el.classList.add('correct');
    playSound('correct');
    state.score += 10;
    state.gi++;
    updateStatsUI();

    if (state.gi >= 5) {
      state.stars++;
      playSound('star');
      document.getElementById('rewardModal').classList.add('active');
      state.gi = 0;
    }
    setTimeout(renderGame, 750);
  } else {
    el.classList.add('wrong');
    playSound('wrong');
    state.lives--;
    if (state.lives <= 0) {
      state.lives = 5; // Reset lives for learning experience
    }
    updateStatsUI();
  }
}

/* Sequence Game Controller */
function renderSeq() {
  document.getElementById('gameTitle').innerText = '7️⃣ പരീക്ഷണക്രമം (ക്രമപ്പെടുത്തുക)';
  const sh = [...SEQ].sort(() => Math.random() - 0.5);
  document.getElementById('gameBox').innerHTML = `
    <p style="font-weight:700;color:#01579B;margin-bottom:12px">ഒരു അളവുജാർ ഉപയോഗിച്ച് ക്രമരഹിതമായ കല്ലിന്റെ വ്യാപ്തം കണ്ടെത്തുന്ന പരീക്ഷണ ഘട്ടങ്ങൾ ശരിയായ ക്രമത്തിൽ ക്ലിക്ക് ചെയ്തു തിരഞ്ഞെടുക്കുക:</p>
    <div>
      ${sh.map(e => `<div class="seq-item" data-o="${e.order}" onclick="toggleSeqSelect(this)">${e.text}</div>`).join('')}
    </div>
    <div style="text-align:center;margin-top:14px">
      <button class="submit-quiz-btn" onclick="checkSeq()">ക്രമം പരിശോധിക്കുക</button>
    </div>
    <div id="seqR" style="margin-top:12px;font-weight:bold"></div>
  `;
}

function toggleSeqSelect(el) {
  playClickSound();
  el.classList.toggle('selected');
}

function checkSeq() {
  playClickSound();
  const sel = [...document.querySelectorAll('.seq-item.selected')].map(x => +x.dataset.o);
  const ok = sel.length === SEQ.length && sel.every((v, i) => v === i + 1);
  const r = document.getElementById('seqR');
  if (ok) {
    playSound('star');
    state.stars++;
    state.score += 25;
    updateStatsUI();
    document.querySelectorAll('.seq-item.selected').forEach(x => x.classList.add('correct'));
    r.innerHTML = '<span style="color:#2E7D32">അത്യുജ്ജ്വലം! പരീക്ഷണത്തിന്റെ ഘട്ടങ്ങൾ കൃത്യമായ ക്രമത്തിലാണ്! 🌟 (+25 സ്കോർ)</span>';
  } else {
    playSound('wrong');
    r.innerHTML = '<span style="color:#C62828">ക്രമം തെറ്റാണ്. ഒന്നാമത്തെ ഘട്ടം മുതൽ അവസാന ഘട്ടം വരെ ക്രമത്തിൽ സെലക്ട് ചെയ്യുക.</span>';
  }
}

/* True / False Game Controller */
function renderTF() {
  const item = TF[state.gi % TF.length];
  document.getElementById('gameTitle').innerText = '8️⃣ ശരിയോ തെറ്റോ (SI നിയമങ്ങൾ)';
  document.getElementById('gameBox').innerHTML = `
    <div style="font-size:2.8rem;margin-bottom:8px">⚖️</div>
    <div style="background:#E1F5FE;border-left:5px solid #0288D1;padding:16px;border-radius:14px;margin-bottom:16px;font-size:1.15rem;font-weight:700;color:#01579B">
      "${item.q}"
    </div>
    <p style="color:#455A64;font-weight:bold;margin-bottom:10px">ഈ പ്രസ്താവന ശരിയാണോ തെറ്റാണോ എന്ന് തിരഞ്ഞെടുക്കൂ:</p>
    <div class="options-grid">
      <button class="option-btn" style="font-size:1.1rem" onclick="ansTF(this, true, ${item.ans})">✅ ശരി (True)</button>
      <button class="option-btn" style="font-size:1.1rem" onclick="ansTF(this, false, ${item.ans})">❌ തെറ്റ് (False)</button>
    </div>
  `;
}

function ansTF(el, got, need) {
  if (got === need) {
    el.classList.add('correct');
    playSound('correct');
    state.score += 10;
    state.gi++;
    updateStatsUI();
    setTimeout(renderGame, 750);
  } else {
    el.classList.add('wrong');
    playSound('wrong');
    state.lives--;
    if (state.lives <= 0) state.lives = 5;
    updateStatsUI();
  }
}

/* Initialization on window load */
window.onload = function() {
  updateStatsUI();
};
</script>
</body>
</html>
